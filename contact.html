  <main>
    <h2>Contact Page</h2>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Get in touch or send a message using the form or contact details below[cite: 1].</p>

    <form class="mc-form" action="#" method="post">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name..." required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email address..." required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>

      <button type="submit" class="mc-btn">Send Message</button>
    </form>
  </main>
